# Render blueprint for the backend. The frontend is deployed on Vercel from app/frontend
# (environment variable NEXT_PUBLIC_API_URL = the URL of this service).
services:
  - type: web
    name: centipede-classifier-api
    runtime: python
    plan: free
    buildCommand: pip install -r app/backend/requirements.txt
    startCommand: cd app/backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        sync: false   # the Vercel domain, e.g. https://your-app.vercel.app
